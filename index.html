<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>高速道路 HUD</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: #000;
    transition: transform 0.15s ease;
  }

  #app.mirrored {
    transform: scaleX(-1);
  }

  /* Header: Route & Direction */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 12vh;
  }

  .route-line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.4em;
    font-size: clamp(1.6rem, 6.5vw, 3.2rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.15;
    text-align: center;
  }

  .route-name {
    color: #fff;
  }

  .route-dir {
    color: #93c5fd;
  }

  .route-dir.unknown {
    color: #6b7280;
  }

  .alert-banner {
    font-size: clamp(0.9rem, 3.5vw, 1.3rem);
    font-weight: 700;
    color: #fbbf24;
    min-height: 1.4em;
    text-align: center;
  }

  .alert-banner.error {
    color: #f87171;
  }

  /* Clock: top-right, half the height of the speed digits */
  .clock {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    font-size: min(11.5vw, 10vh);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    line-height: 1;
    z-index: 5;
  }

  @media (orientation: portrait) {
    .header {
      margin-top: min(11.5vw, 10vh);
    }
  }

  /* Main Display */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    width: 100%;
  }

  .metric-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .metric-label {
    font-size: clamp(0.75rem, 2.5vw, 1rem);
    color: #9ca3af;
    letter-spacing: 0.12em;
    margin-bottom: 0.25em;
  }

  .metric-value-wrap {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.12em;
  }

  .kp-value {
    font-size: min(25vw, 22vh);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    color: #4ade80;
    line-height: 0.95;
    width: 4.6ch;
    min-width: 4.6ch;
    margin-left: -1.15ch;
    flex: 0 0 auto;
    text-align: right;
    white-space: nowrap;
  }

  .kp-unit {
    font-size: min(6.5vw, 6vh);
    font-weight: 600;
    color: #4ade80;
    opacity: 0.85;
  }

  .speed-value {
    font-size: min(23vw, 20vh);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    color: #fff;
    line-height: 0.95;
    width: 3.2ch;
    min-width: 3.2ch;
    margin-left: -1.2ch;
    flex: 0 0 auto;
    text-align: right;
  }

  .speed-unit {
    font-size: min(5.5vw, 5vh);
    font-weight: 600;
    color: #d1d5db;
    opacity: 0.85;
  }

  /* Prediction & Off-route & Unknown States */
  .predicting .kp-value,
  .predicting .kp-unit,
  .predicting .speed-value,
  .predicting .speed-unit {
    color: #fbbf24;
  }

  .offroute .kp-value {
    color: #f87171;
    font-size: min(14vw, 14vh);
    text-align: center;
  }

  .offroute .kp-unit {
    display: none;
  }

  .unknown-pos .kp-value,
  .unknown-pos .speed-value {
    color: #6b7280;
  }

  /* Footer: Status & Controls */
  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .status-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 14px;
    font-size: clamp(0.7rem, 2.6vw, 0.9rem);
    color: #9ca3af;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  .status-item strong {
    color: #e5e7eb;
    font-weight: 600;
  }

  .status-item.state-live strong {
    color: #4ade80;
  }

  .status-item.state-pred strong {
    color: #fbbf24;
  }

  .status-item.state-warn strong {
    color: #f87171;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    width: 100%;
  }

  .btn {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: clamp(0.8rem, 3vw, 0.95rem);
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .btn:active {
    background: rgba(255, 255, 255, 0.24);
  }

  .btn.active {
    background: rgba(74, 222, 128, 0.22);
    border-color: rgba(74, 222, 128, 0.6);
    color: #4ade80;
  }

  .btn.stop-active {
    background: rgba(248, 113, 113, 0.2);
    border-color: rgba(248, 113, 113, 0.55);
    color: #fca5a5;
  }

  /* Landscape layout */
  @media (orientation: landscape) {
    .header {
      min-height: auto;
      gap: 2px;
    }

    .route-line {
      font-size: clamp(1.3rem, 4.5vh, 2.4rem);
    }

    .main {
      flex-direction: row;
      justify-content: space-evenly;
      gap: 4vw;
    }

    .kp-value {
      font-size: min(14.5vw, 40vh);
    }

    .kp-unit {
      font-size: min(4.2vw, 10vh);
    }

    .speed-value {
      font-size: min(14vw, 38vh);
    }

    .speed-unit {
      font-size: min(3.8vw, 9vh);
    }

    .offroute .kp-value {
      font-size: min(9vw, 22vh);
    }

    .footer {
      gap: 6px;
    }

    .clock {
      font-size: min(7vw, 19vh);
    }
  }
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="route-line">
      <span id="routeName" class="route-name">待機中</span>
      <span id="routeDir" class="route-dir unknown">—</span>
    </div>
    <div id="alertBanner" class="alert-banner"></div>
  </header>
  <div id="statusClock" class="clock">--:--:--</div>

  <main id="mainArea" class="main">
    <section class="metric-block">
      <div class="metric-label">キロポスト</div>
      <div class="metric-value-wrap">
        <span id="kpValue" class="kp-value">---.-</span>
        <span id="kpUnit" class="kp-unit">km</span>
      </div>
    </section>

    <section class="metric-block">
      <div class="metric-label">速度</div>
      <div class="metric-value-wrap">
        <span id="speedValue" class="speed-value">--</span>
        <span id="speedUnit" class="speed-unit">km/h</span>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="status-bar">
      <span id="statusState" class="status-item">状態: <strong>停止中</strong></span>
      <span id="statusAcc" class="status-item">精度: <strong>--</strong></span>
      <span id="statusTime" class="status-item">受信: <strong>--:--:--</strong></span>
    </div>
    <div class="controls">
      <button id="toggleBtn" class="btn" type="button">開始</button>
      <button id="mirrorBtn" class="btn" type="button">ミラー</button>
    </div>
  </footer>
</div>

  const toggleBtn = document.getElementById('toggleBtn');
  const mirrorBtn = document.getElementById('mirrorBtn');

  // App state
  let watchId = null;
  let predTimerId = null;
  let wakeLock = null;
  let isWatching = false;
  let isMirrored = false;

  let lastPosTime = 0;
  let lastValidKp = null;
  let lastValidRoute = null;
  let lastFixTime = 0;
  let lastFixLat = null;
  let lastFixLon = null;
  let lastFixKp = null;
  let lastFixRoute = null;

  let direction = 0; // 1 = 下り, -1 = 上り, 0 = —
  let anchorKp = null;
  let anchorRoute = null;

  let speedSamples = [];
  let history15s = []; // { t, speed }
  let currentSmoothedSpeed = null;
  let lastAccuracy = null;
  let errorMsg = '';

  function formatTime(ts) {
    const d = new Date(ts);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    return `${hh}:${mm}:${ss}`;
  }

  function formatKp(kp) {
    const rounded = Math.round(kp * 10) / 10;
    return (Math.abs(rounded) < 0.05 ? 0 : rounded).toFixed(1);
  }

  function clamp(val, min, max) {
    return val < min ? min : (val > max ? max : val);
  }

  function setStatus(label, typeClass) {
    statusStateEl.className = 'status-item' + (typeClass ? ' ' + typeClass : '');
    statusStateEl.innerHTML = `状態: <strong>${label}</strong>`;
  }

  function updateDirectionDisplay(dir) {
    if (dir === 1) {
      routeDirEl.textContent = '下り';
      routeDirEl.className = 'route-dir';
    } else if (dir === -1) {
      routeDirEl.textContent = '上り';
      routeDirEl.className = 'route-dir';
    } else {
      routeDirEl.textContent = '—';
      routeDirEl.className = 'route-dir unknown';
    }
  }

  function findNearestRoutePoint(lat, lon) {
    const mPerDegLat = 111320;
    const mPerDegLon = 111320 * Math.cos(lat * Math.PI / 180);

    let bestDistSq = Infinity;
    let bestRouteName = null;
    let bestKp = null;

    for (let r = 0; r < preparedRoutes.length; r++) {
      const route = preparedRoutes[r];
      const pts = route.points;
      if (pts.length < 2) continue;

      if (lat < route.minLat || lat > route.maxLat || lon < route.minLon || lon > route.maxLon) {
        continue;
      }

      for (let i = 0; i < pts.length - 1; i++) {
        const pA = pts[i];
        const pB = pts[i + 1];
        const latA = pA[0], lonA = pA[1];
        const latB = pB[0], lonB = pB[1];

        // Quick bounding-box check per segment (~500m margin)
        const sMinLat = (latA < latB ? latA : latB) - BOUND_MARGIN_DEG;
        const sMaxLat = (latA > latB ? latA : latB) + BOUND_MARGIN_DEG;
        if (lat < sMinLat || lat > sMaxLat) continue;

        const sMinLon = (lonA < lonB ? lonA : lonB) - BOUND_MARGIN_DEG;
        const sMaxLon = (lonA > lonB ? lonA : lonB) + BOUND_MARGIN_DEG;
        if (lon < sMinLon || lon > sMaxLon) continue;

        // Local planar projection with origin at (lat, lon)
        const ax = (lonA - lon) * mPerDegLon;
        const ay = (latA - lat) * mPerDegLat;
        const bx = (lonB - lon) * mPerDegLon;
        const by = (latB - lat) * mPerDegLat;

        const dx = bx - ax;
        const dy = by - ay;
        const len2 = dx * dx + dy * dy;

        let t = 0;
        if (len2 > 0) {
          t = -(ax * dx + ay * dy) / len2;
          if (t < 0) t = 0;
          else if (t > 1) t = 1;
        }

        const px = ax + t * dx;
        const py = ay + t * dy;
        const distSq = px * px + py * py;

        if (distSq < bestDistSq) {
          bestDistSq = distSq;
          bestRouteName = route.name;
          bestKp = pA[2] + t * (pB[2] - pA[2]);
        }
      }
    }

    if (bestDistSq <= MAX_ROUTE_DIST_SQ) {
      return { onRoute: true, routeName: bestRouteName, kp: bestKp, dist: Math.sqrt(bestDistSq) };
    }
    return { onRoute: false, routeName: null, kp: null, dist: Infinity };
  }

  function updateDirection(routeName, kp) {
    if (anchorRoute !== routeName) {
      anchorRoute = routeName;
      anchorKp = kp;
      direction = 0;
      return;
    }

    const diff = kp - anchorKp;
    if (direction === 0) {
      if (diff >= DIR_HYSTERESIS_KM) {
        direction = 1;
        anchorKp = kp;
      } else if (diff <= -DIR_HYSTERESIS_KM) {
        direction = -1;
        anchorKp = kp;
      }
    } else if (direction === 1) {
      if (kp > anchorKp) {
        anchorKp = kp;
      } else if (diff <= -DIR_HYSTERESIS_KM) {
        direction = -1;
        anchorKp = kp;
      }
    } else if (direction === -1) {
      if (kp < anchorKp) {
        anchorKp = kp;
      } else if (diff >= DIR_HYSTERESIS_KM) {
        direction = 1;
        anchorKp = kp;
      }
    }
  }

  function computeSpeedKmh(pos, match, now) {
    const rawGpsSpeed = pos.coords.speed;
    let instSpeed = null;

    if (typeof rawGpsSpeed === 'number' && !Number.isNaN(rawGpsSpeed) && rawGpsSpeed >= 0) {
      instSpeed = rawGpsSpeed * 3.6;
    } else if (lastFixTime > 0) {
      const dtSec = (now - lastFixTime) / 1000;
      if (dtSec >= 0.25) {
        if (match.onRoute && lastFixKp !== null && lastFixRoute === match.routeName) {
          const dKm = Math.abs(match.kp - lastFixKp);
          instSpeed = dKm / (dtSec / 3600);
        } else if (lastFixLat !== null && lastFixLon !== null) {
          const mPerDegLat = 111320;
          const mPerDegLon = 111320 * Math.cos(pos.coords.latitude * Math.PI / 180);
          const dx = (pos.coords.longitude - lastFixLon) * mPerDegLon;
          const dy = (pos.coords.latitude - lastFixLat) * mPerDegLat;
          const distM = Math.sqrt(dx * dx + dy * dy);
          instSpeed = (distM / dtSec) * 3.6;
        }
        if (instSpeed !== null && instSpeed > 220) {
          instSpeed = null; // Reject GPS jump spike
        }
      }
    }

    if (instSpeed !== null) {
      speedSamples.push(instSpeed);
      if (speedSamples.length > SPEED_WINDOW_SIZE) {
        speedSamples.shift();
      }
      let sum = 0;
      for (let i = 0; i < speedSamples.length; i++) {
        sum += speedSamples[i];
      }
      currentSmoothedSpeed = sum / speedSamples.length;

      history15s.push({ t: now, speed: instSpeed });
      while (history15s.length > 0 && now - history15s[0].t > HISTORY_WINDOW_MS) {
        history15s.shift();
      }
    }

    return currentSmoothedSpeed;
  }

  function getAverageSpeed15s() {
    if (history15s.length === 0) {
      return currentSmoothedSpeed !== null ? clamp(currentSmoothedSpeed, 0, 120) : 0;
    }
    let sum = 0;
    let count = 0;
    for (let i = 0; i < history15s.length; i++) {
      if (lastPosTime - history15s[i].t <= HISTORY_WINDOW_MS) {
        sum += history15s[i].speed;
        count++;
      }
    }
    if (count === 0) return 0;
    return clamp(sum / count, 0, 120);
  }

  function onPosition(pos) {
    const now = Date.now();
    errorMsg = '';
    alertBannerEl.className = 'alert-banner';
    alertBannerEl.textContent = '';

    lastPosTime = now;
    lastAccuracy = pos.coords.accuracy;

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const match = findNearestRoutePoint(lat, lon);
    const speed = computeSpeedKmh(pos, match, now);

    lastFixTime = now;
    lastFixLat = lat;
    lastFixLon = lon;
    lastFixKp = match.onRoute ? match.kp : null;
    lastFixRoute = match.onRoute ? match.routeName : null;

    statusAccEl.innerHTML = `精度: <strong>${lastAccuracy != null ? Math.round(lastAccuracy) + 'm' : '--'}</strong>`;
    statusTimeEl.innerHTML = `受信: <strong>${formatTime(now)}</strong>`;
    speedValueEl.textContent = speed !== null ? String(Math.round(speed)) : '--';

    if (match.onRoute) {
      updateDirection(match.routeName, match.kp);
      lastValidKp = match.kp;
      lastValidRoute = match.routeName;

      mainArea.className = 'main';
      routeNameEl.textContent = match.routeName;
      updateDirectionDisplay(direction);
      kpValueEl.textContent = formatKp(match.kp);
      setStatus('測位中', 'state-live');
    } else {
      lastValidKp = null;
      lastValidRoute = null;
      anchorRoute = null;
      anchorKp = null;
      direction = 0;

      mainArea.className = 'main offroute';
      routeNameEl.textContent = '';
      updateDirectionDisplay(0);
      kpValueEl.textContent = '路線外';
      setStatus('測位中', 'state-live');
    }
  }

  function onPositionError(err) {
    const messages = {
      1: '位置情報の利用が許可されていません',
      2: '位置情報を取得できません',
      3: '位置情報の取得がタイムアウトしました'
    };
    errorMsg = messages[err.code] || '位置情報の取得に失敗しました';
    alertBannerEl.className = 'alert-banner error';
    alertBannerEl.textContent = errorMsg;
  }

  function checkPrediction() {
    if (!isWatching) return;

    const now = Date.now();
    if (lastPosTime === 0) return;

    const elapsedMs = now - lastPosTime;
    if (elapsedMs <= PRED_DELAY_MS) return;

    const elapsedSec = Math.floor(elapsedMs / 1000);

    if (elapsedMs > UNKNOWN_DELAY_MS) {
      mainArea.className = 'main unknown-pos';
      if (lastValidRoute) {
        routeNameEl.textContent = lastValidRoute;
        updateDirectionDisplay(direction);
      } else {
        routeNameEl.textContent = '位置不明';
        updateDirectionDisplay(0);
      }
      if (lastValidKp === null) {
        kpValueEl.textContent = '---.-';
      }
      speedValueEl.textContent = '--';
      alertBannerEl.className = 'alert-banner error';
      alertBannerEl.textContent = '位置不明（GPS未受信 5分超過）';
      setStatus('位置不明', 'state-warn');
      return;
    }

    if (lastValidKp !== null && lastValidRoute !== null) {
      const predSpeed = getAverageSpeed15s();
      const predKp = lastValidKp + direction * (predSpeed * (elapsedMs / 3600000));

      mainArea.className = 'main predicting';
      routeNameEl.textContent = lastValidRoute;
      updateDirectionDisplay(direction);
      kpValueEl.textContent = formatKp(predKp);
      speedValueEl.textContent = String(Math.round(predSpeed));

      alertBannerEl.className = 'alert-banner';
      alertBannerEl.textContent = `推定中 (${elapsedSec}秒)`;
      setStatus(`推定中 (${elapsedSec}秒)`, 'state-pred');
    } else if (!errorMsg) {
      alertBannerEl.className = 'alert-banner';
      alertBannerEl.textContent = `GPS待機中 (${elapsedSec}秒)`;
    }
  }

  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    } catch (_) {
      // Ignore wake lock failures
    }
  }

  async function releaseWakeLock() {
    if (!wakeLock) return;
    try {
      await wakeLock.release();
    } catch (_) {
      // Ignore
    }
    wakeLock = null;
  }

  function startWatching() {
    if (isWatching) return;
    stopDemo();

    if (!('geolocation' in navigator)) {
      alertBannerEl.className = 'alert-banner error';
      alertBannerEl.textContent = 'このブラウザは位置情報に対応していません';
      return;
    }

    isWatching = true;
    errorMsg = '';
    lastPosTime = 0;
    lastFixTime = 0;
    speedSamples = [];
    history15s = [];
    currentSmoothedSpeed = null;

    toggleBtn.textContent = '停止';
    toggleBtn.classList.add('stop-active');
    routeNameEl.textContent = '測位待機中';
    updateDirectionDisplay(0);
    alertBannerEl.className = 'alert-banner';
    alertBannerEl.textContent = '';
    setStatus('測位中', 'state-live');

    watchId = navigator.geolocation.watchPosition(
      onPosition,
      onPositionError,
      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 20000
      }
    );

    predTimerId = setInterval(checkPrediction, PRED_INTERVAL_MS);
    acquireWakeLock();
  }

  function stopWatching() {
    if (!isWatching) return;
    isWatching = false;

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if (predTimerId !== null) {
      clearInterval(predTimerId);
      predTimerId = null;
    }

    releaseWakeLock();

    toggleBtn.textContent = '開始';
    toggleBtn.classList.remove('stop-active');
    mainArea.className = 'main';
    routeNameEl.textContent = '待機中';
    updateDirectionDisplay(0);
    kpValueEl.textContent = '---.-';
    speedValueEl.textContent = '--';
    alertBannerEl.className = 'alert-banner';
    alertBannerEl.textContent = '';
    setStatus('停止中', '');
    statusAccEl.innerHTML = '精度: <strong>--</strong>';
    statusTimeEl.innerHTML = '受信: <strong>--:--:--</strong>';
  }

  // Demo: on page load, count KP down from 120.0 and speed from 120 km/h to 0 over 30 s.
  // Pressing 開始 stops the demo and switches to live GPS.
  let demoTimerId = null;

  function stopDemo() {
    if (demoTimerId !== null) {
      clearInterval(demoTimerId);
      demoTimerId = null;
    }
  }

  function startDemo() {
    stopDemo();
    const DURATION_MS = 30000;
    const startTs = performance.now();
    routeNameEl.textContent = 'デモ';
    updateDirectionDisplay(0);
    setStatus('デモ', '');
    kpValueEl.textContent = formatKp(120);
    speedValueEl.textContent = '120';
    demoTimerId = setInterval(() => {
      const remain = 1 - clamp((performance.now() - startTs) / DURATION_MS, 0, 1);
      kpValueEl.textContent = formatKp(120 * remain);
      speedValueEl.textContent = String(Math.round(120 * remain));
      if (remain <= 0) {
        stopDemo();
        kpValueEl.textContent = formatKp(0);
        speedValueEl.textContent = '0';
        setStatus('デモ終了', '');
      }
    }, 50);
  }

  toggleBtn.addEventListener('click', () => {
    if (isWatching) {
      stopWatching();
    } else {
      startWatching();
    }
  });

  mirrorBtn.addEventListener('click', () => {
    isMirrored = !isMirrored;
    appEl.classList.toggle('mirrored', isMirrored);
    mirrorBtn.classList.toggle('active', isMirrored);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && isWatching) {
      acquireWakeLock();
    }
  });

  function updateClock() {
    statusClockEl.textContent = formatTime(Date.now());
  }
  updateClock();
  setInterval(updateClock, 1000);

  startDemo();
})();
</script>
</body>
</html>
